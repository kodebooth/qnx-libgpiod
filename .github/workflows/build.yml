on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

name: "ci"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64le]
    container:
      image: ghcr.io/kodebooth/libgpiod:0.0.1
    steps:
      - uses: actions/checkout@v6
      - run: |
          qnx_sdp_dir="${QNX_SDP_INSTALL_DIR:-/opt/qnx800}"

          if [ -f "${qnx_sdp_dir}/qnxsdp-env.sh" ]; then
            . "${qnx_sdp_dir}/qnxsdp-env.sh"
          elif [ -f "${qnx_sdp_dir}/qnx-sdp.sh" ]; then
            . "${qnx_sdp_dir}/qnx-sdp.sh"
          else
            echo "QNX environment script not found in ${qnx_sdp_dir}" >&2
            exit 1
          fi

          meson setup --cross-file cross-nto${{ matrix.arch }}.ini build -Dtests=disabled -Dc_args="-DMAX=max -DMIN=min"
          meson compile -C build
